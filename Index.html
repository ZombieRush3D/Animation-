<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAXIM</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #intro {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Roter Glow */
    #glow {
      position: absolute;
      width: 45vw;
      height: 120vh;
      left: -50vw;
      top: -10vh;

      background: radial-gradient(
        ellipse,
        rgba(255, 0, 0, 0.9) 0%,
        rgba(255, 0, 0, 0.35) 35%,
        rgba(255, 0, 0, 0) 70%
      );

      filter: blur(25px);
      transform: rotate(-12deg);

      opacity: 0;
      transition:
        left 2.5s ease,
        opacity 1.5s ease;
    }

    /* Lichtkern */
    #beam {
      position: absolute;
      width: 5px;
      height: 130vh;
      left: -20vw;
      top: -15vh;

      background: #ff0000;

      box-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000,
        0 0 70px #ff0000;

      transform: rotate(-12deg);

      opacity: 0;
      transition:
        left 2.5s ease,
        opacity 1.5s ease;
    }

    /* Logo */
    #logo {
      position: relative;
      z-index: 10;

      color: white;
      text-align: center;
      font-weight: 900;

      opacity: 0;
      transform: scale(0.6);
      filter: blur(15px);

      transition:
        opacity 1s ease,
        transform 1s ease,
        filter 1s ease;
    }

    #m {
      font-size: clamp(140px, 25vw, 350px);
      line-height: 0.8;
      display: block;

      text-shadow: none;

      transition:
        text-shadow 1s ease,
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #maxim {
      font-size: clamp(50px, 9vw, 140px);
      letter-spacing: 0.05em;

      opacity: 0;
      transform: scaleX(0.1);
      filter: blur(12px);

      transition:
        opacity 1s ease,
        transform 1s ease,
        filter 1s ease,
        text-shadow 1s ease;
    }

    /* -------------------------
       ANIMATION
    ------------------------- */

    /* Licht kommt */
    #intro.light-on #glow {
      left: 20vw;
      opacity: 1;
    }

    #intro.light-on #beam {
      left: 28vw;
      opacity: 1;
    }

    /* M erscheint */
    #intro.show-m #logo {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    /* M bekommt Glow */
    #intro.glow-m #m {
      text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000,
        0 0 70px rgba(255, 0, 0, 0.9),
        0 0 120px rgba(255, 0, 0, 0.5);
    }

    /* M verschwindet */
    #intro.transform #m {
      opacity: 0;
      transform: scale(1.15);
      filter: blur(15px);
    }

    /* MAXIM erscheint */
    #intro.transform #maxim {
      opacity: 1;
      transform: scaleX(1);
      filter: blur(0);

      text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000,
        0 0 70px rgba(255, 0, 0, 0.7);
    }

    /* Licht zieht zurück */
    #intro.exit #glow {
      left: 110vw;
      opacity: 0;
    }

    #intro.exit #beam {
      left: 120vw;
      opacity: 0;
    }

    #intro.exit #logo {
      opacity: 0;
      transform: scale(1.03);
      filter: blur(10px);
    }

    /* Mobile */
    @media (max-width: 600px) {
      #m {
        font-size: 42vw;
      }

      #maxim {
        font-size: 14vw;
      }

      #glow {
        width: 90vw;
      }
    }
  </style>
</head>

<body>

  <div id="intro">

    <div id="glow"></div>
    <div id="beam"></div>

    <div id="logo">
      <span id="m">M</span>
      <span id="maxim">MAXIM</span>
    </div>

  </div>


  <script>

    const intro = document.getElementById("intro");

    /*
      1. Schwarz
    */

    setTimeout(() => {

      /*
        2. Roter Lichtstrahl kommt
      */
      intro.classList.add("light-on");

    }, 500);


    setTimeout(() => {

      /*
        4. Großes M erscheint
      */
      intro.classList.add("show-m");

    }, 2500);


    setTimeout(() => {

      /*
        5. M bekommt roten Glow
      */
      intro.classList.add("glow-m");

    }, 3600);


    setTimeout(() => {

      /*
        6. M -> MAXIM
      */
      intro.classList.add("transform");

    }, 4500);


    setTimeout(() => {

      /*
        7. MAXIM bleibt kurz stehen
        8. Licht zieht zurück
      */
      intro.classList.add("exit");

    }, 7000);


    setTimeout(() => {

      /*
        Intro komplett entfernen.
        Hier kann später dein Homescreen stehen.
      */
      intro.style.display = "none";

    }, 8500);

  </script>

</body>
</html>
