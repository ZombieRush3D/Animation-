<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAXIM</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    z-index: 9999;
}


/* =========================
   ROTER GLOW
========================= */

#glow {
    position: absolute;

    width: 65vw;
    height: 140vh;

    left: -70vw;
    top: -20vh;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,0,0,0.95) 0%,
            rgba(255,0,0,0.55) 20%,
            rgba(255,0,0,0.20) 45%,
            transparent 75%
        );

    filter: blur(30px);

    transform: rotate(-12deg);

    opacity: 0;

    transition:
        left 2.8s cubic-bezier(.2,.7,.2,1),
        opacity 1.5s ease;

    z-index: 1;
}


/* =========================
   LICHTSTRAHL
========================= */

#beam {
    position: absolute;

    width: 6px;
    height: 150vh;

    left: -20vw;
    top: -25vh;

    background: #ff0000;

    box-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000,
        0 0 70px #ff0000,
        0 0 120px rgba(255,0,0,.7);

    transform: rotate(-12deg);

    opacity: 0;

    transition:
        left 2.8s cubic-bezier(.2,.7,.2,1),
        opacity 1.5s ease;

    z-index: 2;
}


/* =========================
   LOGO CONTAINER
========================= */

#logo {
    position: relative;

    z-index: 10;

    color: white;

    font-weight: 900;

    text-align: center;

    opacity: 0;

    transform: scale(.65);

    filter: blur(20px);

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.2,.8,.2,1),
        filter 1s ease;
}


/* =========================
   M
========================= */

#m {
    display: block;

    font-size: clamp(150px, 28vw, 380px);

    line-height: .75;

    color: white;

    opacity: 1;

    transform: scale(1);

    filter: blur(0);

    text-shadow: none;

    transition:
        opacity .8s ease,
        transform .9s ease,
        filter .9s ease,
        text-shadow 1s ease;
}


/* =========================
   MAXIM
========================= */

#maxim {
    display: block;

    font-size: clamp(55px, 10vw, 150px);

    line-height: 1;

    letter-spacing: .08em;

    color: white;

    opacity: 0;

    transform: scaleX(.05);

    filter: blur(15px);

    text-shadow: none;

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.2,.8,.2,1),
        filter 1s ease,
        text-shadow 1s ease;
}


/* =========================
   1 → LICHT KOMMT
========================= */

#intro.light #glow {
    left: 15vw;
    opacity: 1;
}

#intro.light #beam {
    left: 25vw;
    opacity: 1;
}


/* =========================
   2 → M ERSCHEINT
========================= */

#intro.show #logo {
    opacity: 1;

    transform: scale(1);

    filter: blur(0);
}


/* =========================
   3 → M GLOW
========================= */

#intro.m-glow #m {

    text-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000,
        0 0 55px #ff0000,
        0 0 100px rgba(255,0,0,.8);

}


/* =========================
   4 → M WIRD ZU MAXIM
========================= */

#intro.transform #m {

    opacity: 0;

    transform: scale(1.18);

    filter: blur(18px);

}


#intro.transform #maxim {

    opacity: 1;

    transform: scaleX(1);

    filter: blur(0);

    text-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000,
        0 0 55px #ff0000,
        0 0 100px rgba(255,0,0,.65);

}


/* =========================
   5 → LICHT ZIEHT ZURÜCK
========================= */

#intro.exit #glow {

    left: 120vw;

    opacity: 0;

}


#intro.exit #beam {

    left: 130vw;

    opacity: 0;

}


/* =========================
   6 → LOGO VERSCHWINDET
========================= */

#intro.exit #logo {

    opacity: 0;

    transform: scale(1.04);

    filter: blur(12px);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #m {
        font-size: 42vw;
    }

    #maxim {
        font-size: 14vw;
    }

    #glow {
        width: 100vw;
    }

}

</style>
</head>


<body>


<div id="intro">

    <div id="glow"></div>

    <div id="beam"></div>

    <div id="logo">

        <span id="m">M</span>

        <span id="maxim">MAXIM</span>

    </div>

</div>


<script>

const intro = document.getElementById("intro");


/*
================================
START
================================
*/


/* 1. Erst komplett schwarz */

setTimeout(() => {

    intro.classList.add("light");

}, 500);


/* 2. M erscheint */

setTimeout(() => {

    intro.classList.add("show");

}, 2600);


/* 3. M bekommt roten Glow */

setTimeout(() => {

    intro.classList.add("m-glow");

}, 3800);


/* 4. M wird MAXIM */

setTimeout(() => {

    intro.classList.add("transform");

}, 4800);


/* 5. MAXIM bleibt stehen */

setTimeout(() => {

    intro.classList.add("exit");

}, 7200);


/* 6. Intro komplett entfernen */

setTimeout(() => {

    intro.remove();

}, 9000);

</script>


</body>
</html>
