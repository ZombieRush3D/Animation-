name: Build MAXIM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p maxim/app/src/main/java/com/maxim/boot
          mkdir -p maxim/app/src/main/res/layout
          mkdir -p maxim/app/src/main/res/values

          cd maxim

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MaximBoot"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.maxim.boot'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.maxim.boot'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Maxim" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <View
                  android:id="@+id/redBeam"
                  android:layout_width="10dp"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:alpha="0"
                  android:background="#FF1515" />

              <TextView
                  android:id="@+id/logoM"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="M"
                  android:textColor="#FFFFFF"
                  android:textSize="150sp"
                  android:textStyle="bold"
                  android:fontFamily="sans-serif-black"
                  android:alpha="0" />

              <TextView
                  android:id="@+id/logoMaxim"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="MAXIM"
                  android:textColor="#FFFFFF"
                  android:textSize="58sp"
                  android:textStyle="bold"
                  android:letterSpacing="0.08"
                  android:fontFamily="sans-serif-black"
                  android:alpha="0" />

          </FrameLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/Theme.Maxim"
                  android:label="MAXIM"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/maxim/boot/MainActivity.kt <<'EOF'
          package com.maxim.boot

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.TextView

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  requestWindowFeature(Window.FEATURE_NO_TITLE)

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  setContentView(R.layout.activity_main)
                  hideSystemUi()
                  startAnimation()
              }

              private fun hideSystemUi() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              }

              private fun startAnimation() {

                  val beam = findViewById<View>(R.id.redBeam)
                  val m = findViewById<TextView>(R.id.logoM)
                  val maxim = findViewById<TextView>(R.id.logoMaxim)

                  beam.alpha = 0f
                  beam.scaleX = 0.2f

                  m.alpha = 0f
                  m.scaleX = 0.7f
                  m.scaleY = 0.7f

                  maxim.alpha = 0f
                  maxim.scaleX = 0.9f
                  maxim.scaleY = 0.9f

                  handler.postDelayed({
                      beam.animate()
                          .alpha(0.9f)
                          .scaleX(18f)
                          .setDuration(500)
                          .start()
                  }, 150)

                  handler.postDelayed({
                      m.animate()
                          .alpha(1f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(650)
                          .start()
                  }, 650)

                  handler.postDelayed({
                      m.animate()
                          .alpha(0f)
                          .scaleX(1.08f)
                          .scaleY(1.08f)
                          .setDuration(400)
                          .start()

                      maxim.animate()
                          .alpha(1f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(600)
                          .start()
                  }, 1900)

                  handler.postDelayed({
                      maxim.animate()
                          .alpha(0f)
                          .setDuration(500)
                          .withEndAction {
                              finishAndRemoveTask()
                          }
                          .start()
                  }, 4300)
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: maxim
        run: gradle assembleDebug

      - name: Upload MAXIM APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXIM-APK
          path: maxim/app/build/outputs/apk/debug/app-debug.apk